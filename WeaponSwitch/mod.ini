[mod]
name = Weapon Switch
author = Eazzy
version = 2.0
description = Faster weapon switching.\nNumber keys pick a category, the mouse wheel and D-pad step through your weapons, and a tap of the weapon wheel button switches to the next one (hold it for the wheel). You can keep moving while the wheel is open.
enabled_by_default = true

[settings]
; Keys:    letters, digits, F1-F24, NUMPAD0-NUMPAD9, SPACE, TAB, SHIFT, CTRL,
;          ALT, ENTER, UP, DOWN, LEFT, RIGHT, MOUSE4, MOUSE5, MMB
; Buttons: A B X Y LB RB LS RS START BACK DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT
;
; Several keys: separate them with commas (key_3 = 3, NUMPAD3).
; Leave a setting empty to turn it off (key_5 =).

; --- Number keys: one per category, press again to cycle within it ---------
; fists
key_1 = 1, NUMPAD1
; melee
key_2 = 2, NUMPAD2
; pistols
key_3 = 3, NUMPAD3
; SMGs
key_4 = 4, NUMPAD4
; shotguns
key_5 = 5, NUMPAD5
; rifles
key_6 = 6, NUMPAD6
; special (rocket launchers)
key_7 = 7, NUMPAD7
; thrown (grenades, molotovs)
key_8 = 8, NUMPAD8

; --- Next / previous weapon --------------------------------------------------
; Mouse wheel. wheel_dir = -1: scroll down for the next weapon; 1 reverses it.
wheel = true
wheel_dir = -1

; Extra keys. The arrow keys already work (they are the D-pad).
next_key =
prev_key =

; Controller buttons, on foot. In vehicles they keep their normal job.
pad_next = DPAD_RIGHT
pad_prev = DPAD_LEFT

; --- Weapon wheel button: tap for the next weapon, hold for the wheel -------
; Keyboard. Keep Q to point at weapons with the mouse.
wheel_key = Q

; Controller. auto = the button your controller layout uses (B, or RB).
pad_wheel = auto

tap_switch = true

; How long to hold before the wheel opens, in milliseconds (50-1000).
hold_ms = 200

; Keep playing while the wheel is open: move with WASD / the left stick, point
; with the mouse / the right stick. false = the game stops while it is open.
move_with_wheel = true

; --- Troubleshooting ---------------------------------------------------------
; Lists what you carry in mods\wml.log, and flags weapons the mod skips.
debug_key = F8
